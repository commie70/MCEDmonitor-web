name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# 最小权限:GITHUB_TOKEN 只读,且 checkout 不落盘凭证
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify generated files are in sync
        shell: bash
        run: |
          node scripts/sync-skills.mjs

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Generated files are out of sync with their source (.codex/skills/clone-website/SKILL.md)."
            echo "Run the sync script locally and commit the result:"
            echo "  node scripts/sync-skills.mjs"
            git status --short
            git diff --stat
            exit 1
          fi
          echo "All generated files are in sync with their sources."

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Monitor pipeline tests
        run: npm run monitor:test

      - name: Build
        run: npm run build
